services:
  mysql-db:
    image: mysql:8.0
    container_name: helpdesk-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-helpdesk_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MYSQL_USER: ${DB_USER:-helpdesk_user}
      MYSQL_PASSWORD: ${DB_PASS:-helpdesk_pass}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15-alpine
    container_name: helpdesk-postgres
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-helpdesk_db}
      POSTGRES_USER: ${PG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_DB_PASS:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mysql_data:
  postgres_data:
