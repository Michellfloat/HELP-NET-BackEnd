spring.application.name=helpdesk_backend

# Perfil ativo padrao (carrega application-local.properties por padrao)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# Upload Settings (Anexos - RF07 / RNF04)
# ===================================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ===================================================================
# Security / JWT Settings
# ===================================================================
api.security.token.secret=${JWT_SECRET:helpdesk_secret_key_32_bytes_min_length_for_hmac_sha}
api.security.token.expiration=${JWT_EXPIRATION:86400000}