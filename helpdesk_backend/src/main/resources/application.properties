spring.application.name=helpdesk_backend
# ===================================================================
# Database Connection Settings
# ===================================================================
# Replace 'localhost:3306' with your host and 'your_database_name' with your schema name
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Database credentials
spring.datasource.username=root
spring.datasource.password=

# Driver Class Name (Optional for modern Spring Boot versions, auto-detected)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Hibernate DDL Auto strategy (options: update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Database Platform / Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Show SQL queries in the console log (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true