# ===================================================================
# Database Connection Settings - Homologação (MySQL)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/helpdesk_homolog?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CORS - Permite chamadas do React rodando em desenvolvimento ou staging
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================================================
# Configurações de Pool e Segurança
# ===================================================================
app.seed.demo=true
app.admin.email=${ADMIN_EMAIL:admin@helpdesk.com}
app.admin.senha=${ADMIN_SENHA:Admin123!}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000