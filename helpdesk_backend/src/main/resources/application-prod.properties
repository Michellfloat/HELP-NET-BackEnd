# Conexao PostgreSQL (A Render costuma passar a URL completa na variavel DATABASE_URL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Em producao, evite 'update'. Use 'validate' se usar Flyway, ou mantenha 'update' com cautela.
# Controlavel por variavel: defina DDL_AUTO=validate assim que houver migracao versionada.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Sem hibernate.dialect: o Hibernate deduz pela URL e avisa (HHH90000025) quando a
# declaracao e redundante.
spring.jpa.show-sql=false

# ===================================================================
# CORS - dominio do front hospedado (varios separados por virgula)
# Ex.: CORS_ALLOWED_ORIGINS=https://helpnet.vercel.app
# ===================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*]}

# ===================================================================
# Contas iniciais
# Os usuarios de demonstracao tem senha escrita no codigo: nao sobem para producao.
# O ADMIN continua sendo criado, porque sem ele nao ha como entrar no ambiente --
# defina ADMIN_SENHA no deploy.
# ===================================================================
app.seed.demo=false
app.admin.email=${ADMIN_EMAIL:admin@helpdesk.com}
app.admin.senha=${ADMIN_SENHA:SuaSenhaAdminSuperSegura123!}


# Limite e renovacao de conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
