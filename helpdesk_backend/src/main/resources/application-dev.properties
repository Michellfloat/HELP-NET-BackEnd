# ===================================================================
# Database Connection Settings - MySQL (porta 3308 do docker-compose)
# ===================================================================
# Mantido como plano B. O banco do projeto e o PostgreSQL (profiles local e prod);
# este profile existe para conseguir subir contra o MySQL antigo se precisar.
# Mapeamento flexivel para Local e Railway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Criacao e atualização automatica das tabelas pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true

# Ajuste do Pool HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000