# Conexao MySQL Local (porta 3308 conforme seu docker-compose)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3308/${DB_NAME:helpdesk_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:helpdesk_user}
spring.datasource.password=${DB_PASS:helpdesk_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true