# ===================================================================
# Database Connection Settings - MySQL (porta 3308 do docker-compose)
# ===================================================================
# Mantido como plano B. O banco do projeto e o PostgreSQL (profiles local e prod);
# este profile existe para conseguir subir contra o MySQL antigo se precisar.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3308/${DB_NAME:helpdesk_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:helpdesk_user}
spring.datasource.password=${DB_PASS:helpdesk_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
