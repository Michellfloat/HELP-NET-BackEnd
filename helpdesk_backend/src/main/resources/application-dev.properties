# ===================================================================
# Database Connection Settings - MySQL (porta 3308 do docker-compose)
# ===================================================================
# Mantido como plano B. O banco do projeto e o PostgreSQL (profiles local e prod);
# este profile existe para conseguir subir contra o MySQL antigo se precisar.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:helpdesk_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:helpdesk_user}
spring.datasource.password=${DB_PASS:helpdesk_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Limite e renovacao de conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000