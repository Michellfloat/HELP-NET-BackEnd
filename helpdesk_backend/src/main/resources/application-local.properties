# ===================================================================
# Database Connection Settings - Local Environment (PostgreSQL)
# ===================================================================
# Casa com o servico postgres-db do docker-compose.yml (porta 5432).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:helpdesk_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# O dialeto nao e declarado de proposito: o Hibernate deduz pela URL, e declarar
# gera o aviso HHH90000025. Sem essa linha, trocar de banco e trocar so a conexao.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
